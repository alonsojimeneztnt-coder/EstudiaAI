<style>
/* Diseño: papel cálido y tinta azul, como un cuaderno; mucho aire, pocas líneas y el subrayador amarillo para lo importante */
:root{
  --bg:#FAF9F6; --surface:#FFFFFF; --soft:#F3F1EC; --hover:#EFEDE7; --line:#E9E5DD; --line-2:#D9D4CA;
  --ink:#1B2236; --ink-2:#3A4257; --muted:#6C7285; --faint:#9EA2AE;
  --primary:#3150D8; --primary-hover:#2641BB; --on-primary:#FFFFFF; --primary-soft:#ECF0FD; --primary-line:#C5D0F6;
  --mark:#FFE58F; --rule:#E3E8F4; --margin:#F2B8B0;
  --ok:#1E7F4C; --ok-soft:#E8F5EC; --bad:#C2483F; --bad-soft:#FBEDEB; --warn:#94650A; --warn-soft:#FBF3DE;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --display:"Bricolage Grotesque","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(27,34,54,.05),0 12px 32px rgba(27,34,54,.07);
  --card-shadow:0 1px 2px rgba(27,34,54,.04);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#12141A; --surface:#191C24; --soft:#1F232D; --hover:#252A35; --line:#2A2F3B; --line-2:#3A404E;
  --ink:#ECEEF3; --ink-2:#C9CDD6; --muted:#979CA9; --faint:#6E7381;
  --primary:#7C9BFF; --primary-hover:#93ADFF; --on-primary:#0E1630; --primary-soft:#1D2742; --primary-line:#33467A;
  --mark:#6B5A1E; --rule:#232838; --margin:#5A2E2B;
  --ok:#52C487; --ok-soft:#13291D; --bad:#F08C82; --bad-soft:#341C1A; --warn:#E3B54A; --warn-soft:#2E2712;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35); --card-shadow:none; color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root[data-theme="auto"]{
  --bg:#12141A; --surface:#191C24; --soft:#1F232D; --hover:#252A35; --line:#2A2F3B; --line-2:#3A404E;
  --ink:#ECEEF3; --ink-2:#C9CDD6; --muted:#979CA9; --faint:#6E7381;
  --primary:#7C9BFF; --primary-hover:#93ADFF; --on-primary:#0E1630; --primary-soft:#1D2742; --primary-line:#33467A;
  --mark:#6B5A1E; --rule:#232838; --margin:#5A2E2B;
  --ok:#52C487; --ok-soft:#13291D; --bad:#F08C82; --bad-soft:#341C1A; --warn:#E3B54A; --warn-soft:#2E2712;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35); --card-shadow:none; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.015em;line-height:1.25;text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.08rem} h3{font-size:.98rem}
p{margin:0}
a{color:var(--primary);text-decoration:none} a:hover{text-decoration:underline}
img{max-width:100%}
[hidden]{display:none!important}
.muted{color:var(--muted)} .small{font-size:.88rem} .tiny{font-size:.8rem}
.label{font-size:.8rem;color:var(--muted);font-weight:500}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.stack.s{gap:8px} .stack.l{gap:32px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
hr.sep{height:1px;background:var(--line);border:0;margin:0}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--hover);text-decoration:none}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.link{display:inline;height:auto;padding:0;border:0;background:none;color:var(--primary);font-weight:inherit;white-space:normal;text-align:left}
.btn.link:hover{text-decoration:underline;background:none}
.btn.danger{color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{height:32px;padding:0 12px;font-size:.87rem}
.btn.lg{height:46px;padding:0 22px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.is-loading{pointer-events:none;opacity:.8}
.btn.is-loading::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@media (pointer:coarse){.btn{height:44px}.btn.sm{height:38px}}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* Formularios */
input[type=text],input[type=email],input[type=password],textarea,select{width:100%;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 12px;min-height:42px;transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
input[readonly]{background:var(--soft);color:var(--muted)}
textarea{resize:vertical;line-height:1.6}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label{font-size:.88rem;font-weight:500;color:var(--ink-2)}
.field .hint{font-size:.82rem;color:var(--muted)}
.field .err{font-size:.84rem;color:var(--bad)}
.field.invalid input{border-color:var(--bad)}
.field.invalid input:focus{box-shadow:0 0 0 3px var(--bad-soft)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;color:var(--ink-2);cursor:pointer;font-weight:400!important}
.check input{width:17px;height:17px;margin:3px 0 0;accent-color:var(--primary);flex:none}
.pw{position:relative}
.pw input{padding-right:86px}
.pw .toggle{position:absolute;right:5px;top:50%;transform:translateY(-50%);height:32px;padding:0 10px;font-size:.84rem}
@media (pointer:coarse),(any-pointer:coarse){input[type=text],input[type=email],input[type=password],textarea,select{font-size:16px}}

/* Estructura de la app */
#root{min-height:100%}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:4px;padding:20px 12px 16px;border-right:1px solid var(--line);background:var(--bg);overflow-y:auto}
.brand{display:inline-flex;align-items:center;gap:10px;padding:4px 10px;font:600 1.05rem var(--font);color:var(--ink);background:none;border:0;cursor:pointer;letter-spacing:-.01em}
.side > .brand{margin-bottom:18px}
.brand b{color:var(--primary);font-weight:600}
.mark{width:28px;height:28px;border-radius:8px;background:var(--primary);display:grid;place-items:center;flex:none}
.mark svg{width:16px;height:16px;fill:none;stroke:var(--on-primary);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;height:38px;padding:0 10px;border-radius:var(--r-sm);border:0;background:none;color:var(--muted);font:inherit;font-size:.93rem;text-align:left;cursor:pointer}
.nav button:hover{background:var(--hover);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--soft);color:var(--ink);font-weight:500}
.nav button[aria-current="page"] svg{color:var(--primary)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 10px 0;display:flex;flex-direction:column;gap:6px;font-size:.86rem;min-width:0}
.side-foot .who{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot .mail{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot .links{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:6px}
.side-foot .links .btn.link{color:var(--muted)}
.side-foot .links .btn.link:hover{color:var(--ink)}
.topbar{display:none}
.scrim{display:none}
main{--pad:44px;min-width:0;padding-top:var(--pad);padding-bottom:88px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .topbar{display:flex;position:sticky;top:0;z-index:30;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-bottom:1px solid var(--line);padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .side{position:fixed;inset:0 auto 0 0;width:min(290px,86vw);z-index:50;transform:translateX(-102%);transition:transform .2s ease;padding-top:calc(20px + env(safe-area-inset-top,0px));box-shadow:var(--shadow)}
  .app.menu .side{transform:none}
  .app.menu .scrim{display:block;position:fixed;inset:0;z-index:40;background:rgba(10,14,22,.3)}
  main{--pad:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
body.focus .side,body.focus .topbar{display:none}
body.focus .app{grid-template-columns:minmax(0,1fr)}

/* Pantalla de acceso */
.auth{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
.auth-aside{background:var(--soft);display:flex;flex-direction:column;justify-content:space-between;gap:48px;padding-block:40px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:40px}
.auth-aside h2{font-size:1.85rem;letter-spacing:-.025em;line-height:1.2;max-width:17ch}
.auth-main{display:flex;justify-content:center;align-items:center;padding-block:48px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.auth-card{width:100%;max-width:390px;display:flex;flex-direction:column;gap:22px}
.auth-title{font-size:1.5rem}
.only-mobile{display:none}
.how,.steps-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px;counter-reset:h}
.how li,.steps-list li{counter-increment:h;display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;color:var(--ink-2);font-size:.95rem}
.how li::before,.steps-list li::before{content:counter(h);width:24px;height:24px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:.78rem;color:var(--muted);background:var(--bg)}
.how b{color:var(--ink);font-weight:500}
.steps-list{gap:10px}
.steps-list li{font-size:.9rem}
.legal-links{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.82rem;padding-top:6px;border-top:1px solid var(--line)}
.legal-links .btn.link{color:var(--muted)}
.legal-links .btn.link:hover{color:var(--ink)}
@media (max-width:860px){
  .auth{grid-template-columns:minmax(0,1fr)}
  .auth-aside{order:2;padding:32px max(20px,env(safe-area-inset-left,0px)) 40px max(20px,env(safe-area-inset-right,0px));gap:24px}
  .auth-aside > .brand,.auth-aside .foot{display:none}
  .auth-aside h2{font-size:1.3rem}
  .auth-main{padding:32px max(20px,env(safe-area-inset-right,0px)) 32px max(20px,env(safe-area-inset-left,0px));align-items:flex-start}
  .only-mobile{display:block;margin-bottom:4px}
}
.code{font:600 1.08rem var(--mono);letter-spacing:.05em;padding:16px;border-radius:var(--r-sm);background:var(--soft);border:1px solid var(--line);text-align:center;user-select:all;overflow-wrap:anywhere}

/* Textos legales */
.legal-page{min-height:100%}
.legal-top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg);border-bottom:1px solid var(--line);padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.legal-main{padding-block:32px 80px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.doc{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.doc h2{font-size:1rem;margin-top:14px}
.doc p,.doc li{color:var(--ink-2);font-size:.95rem}
.doc ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.ph{background:var(--warn-soft);color:var(--warn);padding:0 4px;border-radius:4px;font-size:.92em}

/* Bloques */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head p{color:var(--muted);margin-top:4px}
.section{display:flex;flex-direction:column;gap:14px;min-width:0}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.box{border:1px solid var(--line);border-radius:var(--r);padding:20px;background:var(--bg);min-width:0}
.box.soft{background:var(--soft);border-color:transparent}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);background:var(--soft);font-size:.9rem;color:var(--ink-2)}
.note > svg{margin-top:2px;color:var(--muted)}
.note.info{background:var(--primary-soft)} .note.info > svg{color:var(--primary)}
.note.warn{background:var(--warn-soft)} .note.warn > svg{color:var(--warn)}
.note.bad{background:var(--bad-soft)} .note.bad > svg{color:var(--bad)}
.note.ok{background:var(--ok-soft)} .note.ok > svg{color:var(--ok)}
.note ul{margin:6px 0 0;padding-left:18px}
.provider{padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.provider .pname{font-weight:500}
.confirm-box{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r-sm);border:1px solid var(--bad);background:var(--bad-soft)}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font-size:.76rem;font-weight:500;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.info{background:var(--primary-soft);color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink-2);font:inherit;font-size:.9rem;cursor:pointer;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--faint)}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chip.static{cursor:default;height:28px;padding:0 10px;background:var(--soft);border-color:transparent;font-size:.84rem;color:var(--ink-2)}
.chip.static .btn{height:22px;padding:0 4px}

/* Tarjetas seleccionables */
.opt{position:relative;display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;transition:border-color .15s,background .15s;min-width:0}
.opt:hover{border-color:var(--faint)}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);box-shadow:inset 0 0 0 1px var(--primary)}
.opt .t{display:flex;align-items:center;gap:9px;font-weight:500;padding-right:22px}
.opt .t svg{color:var(--muted)}
.opt[aria-pressed="true"] .t svg{color:var(--primary)}
.opt p{font-size:.85rem;color:var(--muted)}
.opt .big{font-size:1.65rem;font-weight:600;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.opt .sel{position:absolute;top:15px;right:14px;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--bg)}
.opt[aria-pressed="true"] .sel{border:5px solid var(--primary)}
.opt.warned{border-style:dashed}
.opt .warn-t{color:var(--warn)}

/* Asistente */
.steps{display:flex;flex-direction:column;gap:10px}
.steps .bar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.steps .bar i{height:3px;border-radius:3px;background:var(--line)}
.steps .bar i.on{background:var(--primary)}
.steps .lbl{font-size:.86rem;color:var(--muted)}
.steps .lbl b{color:var(--ink);font-weight:500}
.wizard-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--line)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{height:40px;padding:0;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;color:var(--muted);font:inherit;font-size:.92rem;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.seg{display:inline-flex;width:fit-content;padding:3px;background:var(--soft);border-radius:var(--r-sm);gap:2px;max-width:100%;overflow-x:auto}
.seg button{height:30px;padding:0 12px;border:0;border-radius:6px;background:none;color:var(--muted);font:inherit;font-size:.86rem;cursor:pointer;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.drop{display:flex;flex-direction:column;align-items:center;gap:10px;padding:32px 20px;border:1px dashed var(--line-2);border-radius:var(--r);text-align:center;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--primary);background:var(--primary-soft)}
.drop > svg{width:24px;height:24px;color:var(--muted)}
.files{display:flex;flex-direction:column}
.file{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.file:last-child{border-bottom:0}
.file .ext{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;background:var(--soft);color:var(--muted);font:500 .66rem var(--mono);text-transform:uppercase;flex:none}
.file .meta{flex:1;min-width:0}

const te = new TextEncoder(), td = new TextDecoder();

  const base = await crypto.subtle.importKey("raw", te.encode(secret), "PBKDF2", false, ["deriveKey"]);

}

const importDataKey = raw => crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt", "decrypt"]);

  let bytes = te.encode(JSON.stringify(obj)), z = false;
  if (typeof CompressionStream === "function") { try { bytes = await pipeBytes(bytes, new CompressionStream("gzip")); z = true; } catch {} }
  return { v: 1, z, ...(await seal(key, bytes)) };
}

const Vault = {
  id: null, key: null, raw: null, data: null, chain: Promise.resolve(), timer: null, queued: false,
  async open(id, raw) {
    const key = await importDataKey(raw); const env = LS.get(K.data + id);
    const data = env ? await decryptJSON(key, JSON.parse(env)) : null;
    this.id = id; this.raw = raw; this.key = key; this.data = Object.assign(emptyData(), data || {});
  },
  saveSoon() { return this.flush(); },
  /* Guarda en cuanto puede. Si ya hay una escritura en cola, esa incluirá también este cambio */
  flush() {
    clearTimeout(this.timer);
    if (!this.id) return this.chain;
    if (this.queued) return this.chain;
    this.queued = true;
    const id = this.id, key = this.key;
    this.chain = this.chain.then(async () => {
      this.queued = false;
      if (this.id !== id || !this.data) return;
      const env = await encryptJSON(key, this.data);
      if (!LS.set(K.data + id, JSON.stringify(env))) toast("No queda espacio en este navegador. Borra exámenes antiguos para poder guardar los nuevos.", "bad");
    }).catch(e => { this.queued = false; console.warn("No se ha podido guardar", e); });

  },
  async close() { clearTimeout(this.timer); await this.chain; this.id = this.key = this.raw = this.data = null; },

function parseLoose(t) {
  t = String(t || "").trim();
  try { return JSON.parse(t); } catch {}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) { try { return JSON.parse(f[1]); } catch {} }
  const a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch {} }

}
async function blobToImage(blob) {

  const k = Math.min(1, 1568 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
  const url = c.toDataURL("image/jpeg", 0.86);

}

const sleepFor = (ms, signal) => new Promise((res, rej) => { const t = setTimeout(res, ms); if (signal) signal.addEventListener("abort", () => { clearTimeout(t); rej({ code: "cancelled" }); }, { once: true }); });

/* ---------- IA en la nube: servidor gratuito en Cloudflare (worker.js) ---------- */
function makeCloudAI() {
  return wrapAI(async (prompt, opts, quiereJson) => {
    let res;
    try { res = await fetch(CLOUD_AI_URL.replace(/\/+$/, "") + "/ia", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt, quiere_json: quiereJson, max_tokens: opts.maxTokens }), signal: opts.signal }); }
    catch (e) { throw { code: e && e.name === "AbortError" ? "cancelled" : "net_error" }; }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw { code: data.code || "upstream_error", message: data.message };
    if (!str(data.text)) throw { code: "empty_completion" };
    return data;
  });
}

/* ---------- IA de Chrome: Gemini Nano, dentro del ordenador ---------- */
const chromeOpts = img => ({ expectedInputs: [{ type: "text", languages: CHROME_LANGS }, ...(img ? [{ type: "image" }] : [])], expectedOutputs: [{ type: "text", languages: CHROME_LANGS }] });
async function chromeStatus() {
  if (!("LanguageModel" in self)) return { status: "unsupported", images: false };
  try {
    const status = await LanguageModel.availability(chromeOpts(false));
    let images = false;
    if (status === "available") { try { images = (await LanguageModel.availability(chromeOpts(true))) === "available"; } catch {} }
    return { status, images };
  } catch { return { status: "unavailable", images: false }; }
}
function makeChromeAI() {
  return wrapAI(async (prompt, opts, quiereJson) => {
    const imgs = opts.images ? Array.from(opts.images) : [];
    let session;
    try {
      session = await LanguageModel.create(Object.assign(chromeOpts(imgs.length > 0), { initialPrompts: [{ role: "system", content: SYSTEM_BASE + (quiereJson ? SYSTEM_JSON : "") }], signal: opts.signal }));
      const input = imgs.length ? [{ role: "user", content: [{ type: "text", value: prompt }, ...imgs.map(b => ({ type: "image", value: b }))] }] : prompt;
      const text = await session.prompt(input, Object.assign({ signal: opts.signal }, quiereJson && opts.schema ? { responseConstraint: opts.schema } : {}));
      if (!str(text)) throw { code: "empty_completion" };

}
/* Primera vez: Chrome descarga el modelo. Tiene que empezar con un clic */
async function chromeDownload(btn) {
  if (!("LanguageModel" in self)) return;
  setBusy(btn, true);
  let session;
  try {
    const pending = LanguageModel.create(Object.assign(chromeOpts(false), { monitor(m) { m.addEventListener("downloadprogress", e => { S.chrome.progress = e.loaded; const el = $("#chrome-pct"); if (el) el.textContent = Math.round(e.loaded * 100) + " %"; }); } }));
    S.chrome = Object.assign({}, S.chrome, { status: "downloading", progress: 0 }); render();
    session = await pending;
    S.chrome = await chromeStatus(); setupAI();
    toast(S.chrome.status === "available" ? "La IA de Chrome está lista." : "La descarga sigue en curso. Vuelve en unos minutos.", "ok");
  } catch (e) {
    S.chrome = await chromeStatus();
    toast(e && e.name === "NotAllowedError" ? "Pulsa otra vez «Descargar y activar» para empezar la descarga." : "No se ha podido activar la IA de Chrome en este ordenador.", "bad");
  } finally { try { if (session) session.destroy(); } catch {} }

/* ---------- IA en este dispositivo: modelo abierto Qwen3 con WebLLM (WebGPU) ---------- */
let webllmLib = null, localEngine = null, localLoading = null, localProgressFn = null;
async function localStatus() {

  try { if (!(await navigator.gpu.requestAdapter())) return { status: "unsupported" }; } catch { return { status: "unsupported" }; }

}

    webllmLib = webllmLib || await import(WEBLLM_URL);
    localEngine = await webllmLib.CreateMLCEngine(LOCAL_MODEL, { initProgressCallback: r => { if (localProgressFn) localProgressFn(r); } });
    return localEngine;
  })().catch(e => { localLoading = null; throw e; });

}
function makeLocalAI() {
  return wrapAI(async (prompt, opts, quiereJson) => {
    let eng;

    try { eng = await loadLocalEngine(); } catch (e) { throw { code: "local_unavailable", message: String((e && e.message) || e) }; }

    if (opts.signal) opts.signal.addEventListener("abort", stop, { once: true });

      const req = { messages: [{ role: "system", content: SYSTEM_BASE + (quiereJson ? SYSTEM_JSON : "") }, { role: "user", content: prompt }], temperature: 0.4, max_tokens: opts.maxTokens || PROFILES.local.maxTokens, extra_body: { enable_thinking: false } };

      const r = await eng.chat.completions.create(req);

      const c = r && r.choices && r.choices[0];
      const text = str(c && c.message && c.message.content).replace(/<think>[\s\S]*?<\/think>/g, "").trim();
      if (!text) throw { code: "empty_completion" };
      return { text, truncated: c.finish_reason === "length" };
    } catch (e) {
      if (e && e.code) throw e;
      const m = String((e && e.message) || e);

async function localDownload(btn) {
  setBusy(btn, true);
  S.local = { status: "downloading", progress: 0 }; render();
  localProgressFn = r => { S.local.progress = r.progress || 0; const el = $("#local-pct"); if (el) el.textContent = Math.round(S.local.progress * 100) + " %"; };

    await loadLocalEngine();
    LS.set(LS_LOCAL, LOCAL_MODEL);
    S.local = { status: "available" }; setupAI();
    toast("La IA de este dispositivo está lista.", "ok");
  } catch (e) {
    console.warn(e);
    S.local = { status: "downloadable", failed: true };
    toast("No se ha podido descargar o iniciar la IA en este dispositivo. Puede que no tenga memoria suficiente.", "bad");
  }

}
async function localRemove() {
  try { if (localEngine) await localEngine.unload(); } catch {}
  localEngine = null; localLoading = null;
  try { webllmLib = webllmLib || await import(WEBLLM_URL); await webllmLib.deleteModelAllInfoInCache(LOCAL_MODEL); } catch (e) { console.warn(e); }

/* Pide algo a la IA. `build` puede ser un texto o una función que recibe el perfil de la IA

async function ask(build, opts = {}, json = true) {
  const list = S.providers.filter(p => !opts.images || p.images);
  if (!list.length) throw { code: opts.images ? "images_unavailable" : "no_ai" };
  let last;
  for (let i = 0; i < list.length; i++) {
    const p = list[i], prompt = typeof build === "function" ? build(p.profile) : build;
    try { return json ? await p.ai.json(prompt, opts) : await p.ai(prompt, opts); }
    catch (e) { last = e; if (!e || e.code === "cancelled" || i === list.length - 1) throw e; console.warn("Se prueba con la otra IA:", p.id, e.code); }
  }
  throw last;
}
function windowText(text, max, i, n) {
  if (text.length <= max) return text;
  const start = n > 1 ? Math.floor((text.length - max) * i / (n - 1)) : 0;
  const nl = text.indexOf("\n", start), from = nl >= 0 && nl - start < 400 ? nl + 1 : start;
  return text.slice(from, from + max);
}

const srcPdf = {};
const loaded = {};
function loadScript(src) { return loaded[src] || (loaded[src] = new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => { delete loaded[src]; rej(new Error("load")); }; document.head.appendChild(s); })); }
async function ensurePdf() { if (window.pdfjsLib) return; await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"); await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"); }
async function ensureMammoth() { if (window.mammoth) return; await loadScript("https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"); }
const canOCR = () => S.providers.some(p => p.images);
const cleanText = t => String(t || "").replace(/\r/g, "").replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").replace(/[ \t]{2,}/g, " ").trim();
async function pdfText(pdf) {
  const pages = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n); const tc = await page.getTextContent();
    let s = ""; for (const it of tc.items) { s += it.str; s += it.hasEOL ? "\n" : " "; }
    pages.push(cleanText(s));
  }
  return pages;
}
async function pdfPageBlob(pdf, n) {
  const page = await pdf.getPage(n); const v0 = page.getViewport({ scale: 1 });
  const vp = page.getViewport({ scale: Math.min(2.2, 1600 / v0.width) });
  const c = document.createElement("canvas"); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  return new Promise(r => c.toBlob(r, "image/jpeg", 0.86));
}
async function ocrBlobs(blobs, label) {
  const prov = S.providers.find(p => p.images); const max = Math.max(1, prov ? prov.profile.imgMax : 1); const out = [];
  for (let i = 0; i < blobs.length; i += max) {
    const batch = blobs.slice(i, i + max);
    const { text } = await ask(`Estas imágenes son ${label} (partes ${i + 1} a ${i + batch.length}) de unos apuntes o documentos de estudio. Transcribe fielmente todo el texto legible, en orden, conservando títulos, listas y fórmulas en texto plano. Si alguna parte es ilegible escribe [ilegible]. No añadas comentarios, resúmenes ni explicaciones. Si no hay texto, responde exactamente: SIN_TEXTO`, { images: batch }, false);
    if (text.trim() !== "SIN_TEXTO") out.push(text.trim());

async function readSource(src, f) {
  try {
    const ext = src.type; let text = "", note = "";
    if (ext === "txt" || ext === "md") text = await f.text();
    else if (ext === "docx") { await ensureMammoth(); const r = await window.mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() }); text = r.value; }
    else if (ext === "pdf") {
      await ensurePdf();
      const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await f.arrayBuffer()), isEvalSupported: false }).promise;
      srcPdf[src.id] = pdf;
      const pages = await pdfText(pdf);
      const empty = pages.map((p, i) => words(p) < 8 ? i + 1 : 0).filter(Boolean);
      src.pages = pdf.numPages; src.emptyPages = empty;
      text = pages.join("\n\n");
      if (empty.length && empty.length >= pages.length * 0.6) {
        if (!canOCR()) throw new Error("Este PDF parece escaneado. Conecta la IA para leerlo, o pega su texto en «Pegar apuntes».");
        src.status = "ocr"; src.note = "Leyendo " + Math.min(empty.length, 30) + " páginas escaneadas…"; refreshFiles();
        const blobs = []; for (const n of empty.slice(0, 30)) blobs.push(await pdfPageBlob(pdf, n));
        text = cleanText(text + "\n\n" + await ocrBlobs(blobs, "páginas escaneadas de un PDF"));
        src.ocr = true; src.emptyPages = [];
        if (empty.length > 30) note = "Solo se han leído las primeras 30 páginas escaneadas.";
      } else if (empty.length) note = empty.length + (empty.length === 1 ? " página no tiene" : " páginas no tienen") + " texto seleccionable.";
    } else if (["jpg", "jpeg", "png", "webp"].includes(ext)) {
      if (!canOCR()) throw new Error("Para leer fotos de apuntes, conecta primero la IA.");
      src.status = "ocr"; src.note = "Leyendo el texto de la imagen…"; refreshFiles();
      text = await ocrBlobs([f], "fotografías o capturas"); src.ocr = true;
    }
    text = cleanText(text);
    if (words(text) < 5) throw new Error("No se ha podido extraer texto de este archivo. Comprueba que sea legible.");
    src.text = text; src.status = "ok"; src.words = words(text);
    src.note = fmtInt(src.words) + " palabras" + (src.ocr ? " leídas con reconocimiento de texto" : "") + (note ? ". " + note : "");
  } catch (e) {
    src.status = "error"; src.text = "";
    src.note = e && e.code ? aiError(e) : (e && e.message && e.message !== "load" ? e.message : "No se ha podido leer el archivo. Comprueba tu conexión a internet o copia y pega su texto.");
  }
  refreshFiles(); refreshContentSummary();
}
async function ocrRemaining(id) {
  const src = S.draft.sources.find(s => s.id === id), pdf = srcPdf[id];
  if (!src || !pdf || !canOCR()) return;
  const pages = src.emptyPages.slice(0, 30);
  src.status = "ocr"; src.note = "Leyendo " + pages.length + " páginas…"; refreshFiles();
  try {
    const blobs = []; for (const n of pages) blobs.push(await pdfPageBlob(pdf, n));
    const t = await ocrBlobs(blobs, "páginas escaneadas de un PDF");
    src.text = cleanText(src.text + "\n\n" + t); src.emptyPages = []; src.ocr = true; src.words = words(src.text);
    src.status = "ok"; src.note = fmtInt(src.words) + " palabras, incluidas las páginas escaneadas";
  } catch (e) { src.status = "ok"; src.note = aiError(e); }

function addFiles(list, replaceId) {
  const d = S.draft;
  for (const f of Array.from(list)) {
    const ext = (f.name.split(".").pop() || "").toLowerCase();
    const okExt = ["pdf", "docx", "txt", "md", "jpg", "jpeg", "png", "webp"];
    if (!replaceId && d.sources.filter(s => s.kind === "file").length >= MAX_FILES) { toast("Puedes añadir hasta " + MAX_FILES + " documentos por examen.", "bad"); break; }
    const src = { id: uid(), kind: "file", name: f.name, type: ext, size: f.size, status: "reading", text: "", note: "Leyendo el archivo…" };
    if (!okExt.includes(ext)) { src.status = "error"; src.note = ext === "doc" ? "Los .doc antiguos no son compatibles. Guárdalo como .docx o PDF." : "Formato no compatible. Usa PDF, DOCX, TXT o una imagen."; }
    else if (f.size > MAX_FILE_MB * 1048576) { src.status = "error"; src.note = "El archivo supera los " + MAX_FILE_MB + " MB."; }
    else if (!f.size) { src.status = "error"; src.note = "El archivo está vacío."; }
    if (replaceId) { const i = d.sources.findIndex(s => s.id === replaceId); if (i >= 0) d.sources[i] = src; else d.sources.push(src); replaceId = null; }
    else d.sources.push(src);
    if (src.status === "reading") readSource(src, f);
  }

function stats() {
  const list = finished().filter(a => a.status === "corregido");
  const grades = list.map(a => a.grade);
  const avg = grades.length ? grades.reduce((a, b) => a + b, 0) / grades.length : null;
  const best = grades.length ? Math.max(...grades) : null;
  const bySub = {};
  for (const a of list) { const s = bySub[a.subject] || (bySub[a.subject] = { n: 0, sum: 0 }); s.n++; s.sum += a.grade; }
  const subjects = Object.entries(bySub).map(([k, v]) => ({ name: k, n: v.n, avg: v.sum / v.n })).sort((a, b) => b.n - a.n);
  const byType = {}, fails = {};
  for (const a of list) {
    const e = examById(a.examId); if (!e) continue;
    for (const id of a.qids) {
      const q = e.questions.find(x => x.id === id), r = a.results[id]; if (!q || !r || r.pending) continue;
      const t = byType[q.type] || (byType[q.type] = { n: 0, sum: 0 }); t.n++; t.sum += r.score;
      const k = e.id + "/" + id; const f = fails[k] || (fails[k] = { q, exam: e, seen: 0, bad: 0 }); f.seen++; if (r.score < 0.5) f.bad++;
    }
  }
  const types = Object.entries(byType).map(([k, v]) => ({ type: k, n: v.n, pct: v.sum / v.n })).sort((a, b) => MODE_ORDER.indexOf(a.type) - MODE_ORDER.indexOf(b.type));
  const worst = Object.values(fails).filter(f => f.bad > 0).sort((a, b) => b.bad - a.bad || b.bad / b.seen - a.bad / a.seen).slice(0, 8);

let answerT = null;

async function submitAttempt(a) { stopTimer(); clearTimeout(answerT); a.finishedAt = Date.now(); document.body.classList.remove("focus"); await gradeAttempt(a); }

/* ---------- Resultado ---------- */
function answerText(q, v) {
  if (!isAnswered(q, v)) return "Sin responder";
  if (q.type === "test") return q.options[v];
  if (q.type === "tf") return v ? "Verdadero" : "Falso";
  if (q.type === "fill") { let k = 0; return q.text.replace(/\[\[\d+\]\]/g, () => "«" + (str(v[k++]) || "…") + "»"); }
  if (q.type === "match") return q.pairs.map((p, i) => p.a + " → " + (v[i] != null ? q.pairs[v[i]].b : "sin responder")).join("\n");
  return v;
}
function correctText(q) {
  if (q.type === "test") return q.options[q.correct];
  if (q.type === "tf") return q.answer ? "Verdadero" : "Falso";
  if (q.type === "fill") { let k = 0; return q.text.replace(/\[\[\d+\]\]/g, () => "«" + q.blanks[k++][0] + "»"); }
  if (q.type === "match") return q.pairs.map(p => p.a + " → " + p.b).join("\n");
  return q.answer;
}
VIEWS.resultado = () => {
  const a = attemptById(S.params.id), e = a && examById(a.examId);
  if (!a) return emptyState("results", "No se ha encontrado este resultado.", "Puede que se haya eliminado.", false);
  if (!e) return `<header class="page-head"><div><h1>${esc(a.title)}</h1><p>El examen original se ha eliminado. Nota obtenida: ${fmtGrade(a.grade)}.</p></div></header>`;
  const rows = a.qids.map((id, i) => ({ i, q: e.questions.find(x => x.id === id), r: a.results[id] || { pending: true }, v: a.answers[id] })).filter(x => x.q);
  const tally = { ok: 0, part: 0, bad: 0, none: 0, pend: 0 };
  rows.forEach(x => { if (x.r.pending) tally.pend++; else tally[x.r.verdict] = (tally[x.r.verdict] || 0) + 1; });
  const failed = rows.filter(x => !x.r.pending && x.r.score < 1);
  const topics = {}; failed.forEach(x => { if (x.q.topic) topics[x.q.topic] = (topics[x.q.topic] || 0) + 1; });
  const byType = {}; rows.forEach(x => { if (x.r.pending) return; const t = byType[x.q.type] || (byType[x.q.type] = { n: 0, s: 0 }); t.n++; t.s += x.r.score; });
  const filt = S.resFilter;
  const shown = rows.filter(x => filt === "all" || (filt === "bad" ? (x.r.pending || x.r.score < 1) : (!x.r.pending && x.r.score >= 1)));
  const g = a.grade, n = rows.length;

  <section class="grade-hero">
    <div class="stack s"><span class="grade" style="color:var(--${gradeTone(g) || "ink"})">${fmtGrade(g)}<small> / 10</small></span><span class="pill ${gradeTone(g)}" style="width:fit-content">${a.status === "pendiente" ? "Provisional" : gradeLabel(g)}</span></div>

      <div class="tally"><span><span class="dot" style="background:var(--ok)"></span><b>${tally.ok}</b> correctas</span><span><span class="dot" style="background:var(--warn)"></span><b>${tally.part}</b> parciales</span><span><span class="dot" style="background:var(--bad)"></span><b>${tally.bad}</b> incorrectas</span><span><span class="dot" style="background:var(--faint)"></span><b>${tally.none}</b> sin responder</span>${tally.pend ? `<span><span class="dot" style="background:var(--primary)"></span><b>${tally.pend}</b> pendientes</span>` : ""}</div>

function resultCard({ i, q, r, v }, a) {
  const cls = r.pending ? "pend" : r.verdict === "ok" ? "ok" : r.verdict === "part" ? "part" : r.verdict === "none" ? "none" : "bad";
  const lab = { ok: ["ok", "Correcta"], part: ["warn", "Parcial"], bad: ["bad", "Incorrecta"], none: ["", "Sin responder"], pend: ["info", "Pendiente"] }[cls];
  const open = ["theory", "practical", "short"].includes(q.type);
  return `<article class="qres ${cls}">
    <div class="row between"><span class="label num">Pregunta ${i + 1} · ${MODES[q.type].label}${q.topic ? " · " + esc(q.topic) : ""}</span><span class="row nowrap" style="gap:8px"><span class="pill ${lab[0]}">${lab[1]}</span>${!r.pending ? `<span class="tiny muted num">${fmtGrade(r.score * MODES[q.type].w)} / ${MODES[q.type].w} pt</span>` : ""}</span></div>
    <p style="font-weight:500;white-space:pre-wrap">${esc(q.type === "fill" ? q.prompt + "\n" + q.text.replace(/\[\[\d+\]\]/g, "____") : q.prompt)}</p>
    ${q.type === "test" ? `<div class="q-opts">${(a.optionOrders[q.id] || range(q.options.length)).map((oi, k) => `<div class="q-opt ${oi === q.correct ? "right" : oi === v ? "wrong" : "plain"}"><span class="k">${"ABCDEFGH"[k]}</span><span>${esc(q.options[oi])}${oi === v ? ' <span class="muted small">(tu respuesta)</span>' : ""}</span></div>`).join("")}</div>` :
    `<div class="ans-grid"><div class="ans-box"><span class="label">Tu respuesta</span>${esc(answerText(q, v))}</div>${cls !== "ok" || open ? `<div class="ans-box ok"><span class="label">${open ? "Respuesta modelo" : "Respuesta correcta"}</span>${esc(correctText(q))}</div>` : ""}</div>`}
    ${r.feedback ? `<p class="expl"><b>Corrección:</b> ${esc(r.feedback)}${r.missing && r.missing.length ? `<br><b>Te faltó:</b> ${r.missing.map(esc).join("; ")}` : ""}${r.errors && r.errors.length ? `<br><b>Errores:</b> ${r.errors.map(esc).join("; ")}` : ""}</p>` : ""}
    ${q.explanation ? `<p class="expl"><b>Explicación:</b> ${esc(q.explanation)}</p>` : ""}
  </article>`;
}

/* ============================================================
   Acciones
   ============================================================ */
function setBusy(el, on) { if (!el) return; el.classList.toggle("is-loading", on); el.disabled = on; }
function authFail(e) {
  S.authErr = e && e.msg ? e : { msg: "Ha ocurrido un error inesperado. Vuelve a intentarlo." };
  if (S.authErr.field === "password") S.authForm.password = "";
  render();
  const id = { email: ["l-email", "r-email", "v-email"], password: ["l-password", "r-password", "v-password"], code: ["v-code"], terms: ["r-terms"], age: ["r-age"] }[S.authErr.field];
  if (id) for (const x of id) { const el = $("#" + x); if (el) { el.focus(); break; } }
}
function afterAuth(acc, route) { S.authForm = { remember: true }; S.authErr = null; enterApp(acc); go(route || "panel"); }
async function logout(msg) {
  stopTimer(); clearTimeout(answerT);
  const a = S.route === "examen" && attemptById(S.params.id); if (a) saveAttempt(a);
  await Vault.flush(); Auth.clearSession(); await Vault.close();
  Object.assign(S, { user: null, name: "", exams: [], attempts: [], profile: {}, draft: null, ai: null, providers: [], busy: null, pendingCode: null, codeSaved: false, authMode: "login", authForm: { remember: true }, authErr: null });
  go("acceso"); toast(msg || "Has cerrado la sesión.");
}
const FORMS = {
  async login(form) {
    const f = S.authForm;
    if (!validEmail(f.email)) return authFail({ field: "email", msg: "Escribe un correo válido, por ejemplo nombre@correo.com." });
    if (!f.password) return authFail({ field: "password", msg: "Escribe tu contraseña." });
    setBusy(form.querySelector("[type=submit]"), true);
    try { afterAuth(await Auth.login({ email: f.email, password: f.password, remember: f.remember !== false })); }
    catch (e) { authFail(e); }
  },
  async registro(form) {
    const f = S.authForm;
    if (!validEmail(f.email)) return authFail({ field: "email", msg: "Escribe un correo válido, por ejemplo nombre@correo.com." });
    if (!f.password || f.password.length < 8) return authFail({ field: "password", msg: "La contraseña debe tener al menos 8 caracteres." });
    if (!f.terms) return authFail({ field: "terms", msg: "Para crear la cuenta tienes que aceptar las Condiciones de uso y la Política de privacidad." });
    if (!f.age) return authFail({ field: "age", msg: "Para usar estudiaAI tienes que tener 14 años o más." });
    setBusy(form.querySelector("[type=submit]"), true);
    try { const { acc, code } = await Auth.register({ name: f.name, email: f.email, password: f.password, remember: f.remember !== false }); S.pendingCode = code; S.codeSaved = false; afterAuth(acc, "codigo"); }
    catch (e) { authFail(e); }
  },
  async recuperar(form) {
    const f = S.authForm;
    if (!validEmail(f.email)) return authFail({ field: "email", msg: "Escribe un correo válido, por ejemplo nombre@correo.com." });
    if (normCode(f.code).length !== 20) return authFail({ field: "code", msg: "El código tiene 20 letras y números, en grupos de cuatro." });
    if (!f.password || f.password.length < 8) return authFail({ field: "password", msg: "La nueva contraseña debe tener al menos 8 caracteres." });
    setBusy(form.querySelector("[type=submit]"), true);
    try { afterAuth(await Auth.recover({ email: f.email, code: f.code, password: f.password, remember: f.remember !== false })); toast("Contraseña cambiada. Ya has entrado en tu cuenta.", "ok"); }
    catch (e) { authFail(e); }
  },
  async "change-pw"(form) {
    const cur = $("#cp-current").value, next = $("#cp-new").value, btn = form.querySelector("[type=submit]");
    if (!cur) { toast("Escribe tu contraseña actual.", "bad"); return; }
    if (next.length < 8) { toast("La contraseña nueva debe tener al menos 8 caracteres.", "bad"); return; }
    setBusy(btn, true);
    try { await Auth.changePassword(cur, next); toast("Contraseña cambiada.", "ok"); render(); }
    catch (e) { setBusy(btn, false); toast(e && e.msg ? e.msg : "No se ha podido cambiar la contraseña.", "bad"); }
  },
  async "delete-account"(form) {
    const pw = $("#del-pw").value, btn = form.querySelector("[type=submit]");
    if (!pw) { toast("Escribe tu contraseña para confirmar.", "bad"); return; }
    setBusy(btn, true);
    try {
      stopTimer(); clearTimeout(answerT);
      await Auth.remove(pw);
      Object.assign(S, { user: null, name: "", exams: [], attempts: [], profile: {}, draft: null, ai: null, providers: [], authMode: Object.keys(Auth.list()).length ? "login" : "registro", authForm: { remember: true }, authErr: null });
      go("acceso"); toast("Tu cuenta y todos sus datos se han eliminado.");
    } catch (e) { setBusy(btn, false); toast(e && e.msg ? e.msg : "No se ha podido eliminar la cuenta.", "bad"); }
  },
};
const ACT = {
  go: el => go(el.dataset.r, Object.assign(el.dataset.id ? { id: el.dataset.id } : {}, el.dataset.focus ? { focus: el.dataset.focus } : {})),
  menu: () => { const app = $("#app"); if (app) app.classList.toggle("menu"); },
  "auth-mode": el => { S.authMode = el.dataset.m; S.authErr = null; S.authForm.password = ""; render(); const first = $("#root form input"); if (first) first.focus(); },
  "pw-toggle": el => { const i = $("#" + el.dataset.for); if (!i) return; const show = i.type === "password"; i.type = show ? "text" : "password"; el.textContent = show ? "Ocultar" : "Mostrar"; i.focus(); },
  legal: el => { if (S.route !== "legal") S.legalBack = { route: S.route, params: S.params }; go("legal", { doc: el.dataset.doc }); },
  "legal-tab": el => { S.params = { doc: el.dataset.doc }; render(); window.scrollTo(0, 0); },
  "legal-back": () => { const b = S.legalBack; S.legalBack = null; if (b && (S.user || PUBLIC.includes(b.route))) go(b.route, b.params || {}); else go(S.user ? "panel" : "acceso"); },
  logout: () => logout(),
  "copy-code": () => copyText(S.pendingCode, $("#rec-code")),
  "download-code": () => saveFile("estudiaAI-codigo-de-recuperacion.txt", `estudiaAI · Código de recuperación\n\nCuenta: ${S.user.email}\nCódigo: ${S.pendingCode}\n\nGuárdalo en un lugar seguro. Lo necesitarás si olvidas tu contraseña.\n`),
  "code-continue": () => { if (!S.codeSaved) return; S.pendingCode = null; S.codeSaved = false; go(deviceAIPossible() ? "conectar" : "panel"); },
  "chrome-download": el => chromeDownload(el),
  "local-download": el => localDownload(el),
  "local-remove": () => localRemove(),
  report: el => {
    if (!LEGAL.email) { toast("Todavía no hay un correo de contacto configurado."); return; }
    const a = attemptById(el.dataset.id);
    location.href = "mailto:" + LEGAL.email + "?subject=" + encodeURIComponent("estudiaAI: problema en «" + (a ? a.title : "un examen") + "»") + "&body=" + encodeURIComponent("Cuéntanos qué pregunta tiene el problema y qué está mal:\n\n");
  },
  theme: el => { S.profile.theme = el.dataset.v; applyTheme(el.dataset.v); saveProfile(); render(); },
  export: () => { saveFile("estudiaAI-mis-datos.json", JSON.stringify({ exportado: new Date().toISOString(), cuenta: S.user.email, perfil: S.profile, examenes: S.exams, intentos: S.attempts }, null, 2), "application/json"); },
  "ask-wipe": () => { S.confirmDel = "wipe"; render(); },
  "ask-del-account": () => { S.confirmDel = "account"; render(); const i = $("#del-pw"); if (i) i.focus(); },
  wipe: () => { S.exams = []; S.attempts = []; Vault.data.exams = {}; Vault.data.attempts = {}; Vault.saveSoon(); S.confirmDel = null; S.draft = null; render(); toast("Se han borrado tus exámenes y resultados."); },
  "new-exam": () => { if (!S.draft || S.draft.fromExam) S.draft = newDraft(); go("crear"); },
  "reset-draft": () => { S.draft = newDraft(); render(); },
  "cancel-busy": () => { if (S.busy && S.busy.ctl) S.busy.ctl.abort(); },
  tab: el => { S.draft.tab = el.dataset.t; render(); },
  step: el => {
    const d = S.draft, n = d.step + Number(el.dataset.d);
    if (n > d.step && !canNext()) return;
    if (n === 3 && !d.subject && d.suggestedSubject) d.subject = d.suggestedSubject;
    d.step = clamp(n, 1, 5); render(); window.scrollTo(0, 0);
  },
  analyze: () => analyzeContent(),
  "topic-notes": async el => {
    const d = S.draft; if (!str(d.topic)) { toast("Escribe primero el tema.", "bad"); const t = $("#topic"); if (t) t.focus(); return; }
    setBusy(el, true);
    try {
      const { text } = await ask(p => `Escribe unos apuntes de estudio sobre «${d.topic}» para un estudiante de nivel ${d.level || S.profile.level || "secundaria"}. Entre ${p.notesWords} palabras, en español, organizados en apartados con definiciones, datos clave, fechas o fórmulas si corresponden. Usa solo conocimientos ampliamente establecidos y omite cualquier dato del que no estés seguro. Sin introducción ni despedida, solo los apuntes en texto plano.`, {}, false);
      d.topicText = cleanText(text); render();
    } catch (e) { toast(aiError(e), "bad"); setBusy(el, false); }
  },
  "clear-topic": () => { S.draft.topicText = ""; render(); },
  "remove-file": el => { S.draft.sources = S.draft.sources.filter(s => s.id !== el.dataset.id); refreshFiles(); refreshContentSummary(); },
  "replace-file": el => { const inp = $("#file-replace"); inp.dataset.id = el.dataset.id; inp.click(); },
  ocr: el => ocrRemaining(el.dataset.id),
  mode: el => {
    const d = S.draft, m = el.dataset.m;
    if (m === "mixed") {
      d.mixed = !d.mixed;
      if (!d.mixed && d.modes.length > 1) d.modes = d.modes.slice(0, 1);
      if (d.mixed && d.modes.length < 2) { const bad = new Set((d.analysis && d.analysis.noAdecuadas || []).map(x => x.tipo)); d.modes = ["test", "tf", "short", "theory"].filter(x => !bad.has(x)).slice(0, 3); }
    } else { d.modes = d.modes.includes(m) ? d.modes.filter(x => x !== m) : [...d.modes, m]; d.mixed = d.modes.length > 1; }
    render();
  },
  subject: el => { S.draft.subject = el.dataset.s; render(); },
  "custom-subject": () => {
    const v = str(S.draft.customSubject); if (!v) { toast("Escribe el nombre de la asignatura.", "bad"); return; }
    S.draft.subject = v; const list = S.profile.customSubjects || [];
    if (!SUBJECTS.includes(v) && !list.includes(v)) { S.profile.customSubjects = [...list, v].slice(-30); saveProfile(); }
    S.draft.customSubject = ""; render();
  },
  duration: el => { S.draft.duration = Number(el.dataset.v); render(); },
  difficulty: el => { S.draft.difficulty = el.dataset.v; render(); },
  generate: () => generateExam(),
  start: () => { const a = attemptById(S.params.id); a.status = "en_curso"; a.startedAt = Date.now(); S.run.idx = 0; saveAttempt(a); render(); },
  "ans-opt": el => { const { a, q } = curQ(); a.answers[q.id] = Number(el.dataset.v); $$("#qbody .q-opt").forEach(b => { const on = b === el; b.setAttribute("aria-pressed", on); b.setAttribute("aria-checked", on); }); markNav(a, q); saveAnswerSoon(a); },
  "ans-tf": el => { const { a, q } = curQ(); a.answers[q.id] = el.dataset.v === "true"; $$("#qbody .q-opt").forEach(b => { const on = b === el; b.setAttribute("aria-pressed", on); b.setAttribute("aria-checked", on); }); markNav(a, q); saveAnswerSoon(a); },
  qmove: el => { const a = attemptById(S.params.id); S.run.idx = clamp(S.run.idx + Number(el.dataset.d), 0, a.qids.length - 1); saveAttempt(a); render(); },
  qgo: el => { S.run.idx = Number(el.dataset.i); render(); },
  flag: () => { const { a, q } = curQ(); a.flags[q.id] = !a.flags[q.id]; saveAnswerSoon(a); render(); },
  "ask-submit": () => { S.run.confirm = true; render(); window.scrollTo(0, 0); },
  "cancel-submit": () => { S.run.confirm = false; render(); },
  submit: () => { const a = attemptById(S.params.id); S.run.confirm = false; submitAttempt(a); },
  regrade: () => { const a = attemptById(S.params.id); gradeAttempt(a); },
  resfilter: el => { S.resFilter = el.dataset.f; render(); },
  repeat: el => { const prev = attemptById(el.dataset.id), e = examById(prev.examId), a = newAttempt(e, prev.qids.slice(), "repeticion"); saveAttempt(a); go("examen", { id: a.id }); },
  "repeat-fails": el => {
    const prev = attemptById(el.dataset.id), e = examById(prev.examId);
    const ids = prev.qids.filter(id => { const r = prev.results[id]; return r && !r.pending && r.score < 1; });
    const a = newAttempt(e, ids, "fallos");
    a.duration = Math.max(5, Math.min(e.duration, Math.ceil(ids.reduce((s, id) => s + MODES[(e.questions.find(x => x.id === id) || {}).type || "test"].min, 0) * 1.3)));
    saveAttempt(a); go("examen", { id: a.id });
  },
  "repeat-exam": el => { const e = examById(el.dataset.id), a = newAttempt(e, e.questions.map(q => q.id), "repeticion"); saveAttempt(a); go("examen", { id: a.id }); },
  regen: el => {
    const e = examById(el.dataset.id), d = newDraft(), key = srcKey(e.source.text), same = S.exams.filter(x => srcKey(x.source.text) === key);
    Object.assign(d, { step: 5, sources: [{ id: uid(), kind: "file", name: "Contenido de «" + e.title + "»", type: "txt", size: e.source.text.length, status: "ok", text: e.source.text.replace(/^=== FUENTE:.*===$/gm, "").trim(), note: "" }],
      modes: e.modes.slice(), mixed: e.modes.length > 1, mix: Object.fromEntries(Object.entries(e.mix || {}).map(([k, v]) => [k, Math.round(v * 100)])), subject: e.subject, duration: e.duration, difficulty: e.difficulty, level: e.level || "",
      title: e.title.replace(/ \(\d+\)$/, "") + " (" + (same.length + 1) + ")", avoid: same.flatMap(x => x.questions.map(qText)), fromExam: e.id });
    d.analysis = e.analysis ? { ...e.analysis, suficiente: true, words: e.source.words, avisos: [], noAdecuadas: e.analysis.noAdecuadas || [], conceptos: [], definiciones: [], fechas: [], formulas: [], procesos: [] } : null;
    S.draft = d; d.analysisKey = contentKey(d); go("crear");
  },
  "ask-del": el => { S.confirmDel = el.dataset.id; render(); },
  "cancel-del": () => { S.confirmDel = null; render(); },
  "del-exam": el => {
    const id = el.dataset.id;
    for (const a of S.attempts.filter(x => x.examId === id)) delete Vault.data.attempts[a.id];
    delete Vault.data.exams[id];
    S.exams = S.exams.filter(e => e.id !== id); S.attempts = S.attempts.filter(a => a.examId !== id);
    S.confirmDel = null; Vault.saveSoon(); render(); toast("Examen eliminado.");
  },
  "home-tip-done": () => { S.profile.homeTipDone = true; saveProfile(); render(); },
  "del-subject": el => { S.profile.customSubjects = (S.profile.customSubjects || []).filter(s => s !== el.dataset.s); saveProfile(); render(); },
};
const INPUT = {
  paste: el => { S.draft.pasted = el.value; refreshContentSummary(); },
  topic: el => { S.draft.topic = el.value; },
  topicText: el => { S.draft.topicText = el.value; refreshContentSummary(); },
  customSubject: el => { S.draft.customSubject = el.value; },
  title: el => { S.draft.title = el.value; },
  mix: el => { S.draft.mix[el.dataset.m] = Number(el.value); const pct = mixPct(S.draft); for (const m in pct) { const v = $("#mixv-" + m); if (v) v.textContent = Math.round(pct[m] * 100) + " %"; } },
  "ans-text": el => { const { a, q } = curQ(); a.answers[q.id] = el.value; markNav(a, q); saveAnswerSoon(a); },
  "ans-fill": el => { const { a, q } = curQ(); const arr = Array.isArray(a.answers[q.id]) ? a.answers[q.id] : new Array(q.blanks.length).fill(""); arr[Number(el.dataset.i)] = el.value; a.answers[q.id] = arr; el.size = Math.max(8, el.value.length + 2); markNav(a, q); saveAnswerSoon(a); },
};
const CHANGE = {
  files: el => { if (el.files.length) addFiles(el.files); el.value = ""; },
  replace: el => { if (el.files.length) addFiles([el.files[0]], el.dataset.id); el.value = ""; },
  level: el => { S.draft.level = el.value; },
  "res-subject": el => { S.resSubject = el.value; render(); },
  "code-saved": el => { S.codeSaved = el.checked; const b = $("#code-continue"); if (b) b.disabled = !el.checked; },
  "ans-match": el => { const { a, q } = curQ(); const m = { ...(a.answers[q.id] || {}) }; if (el.value === "") delete m[el.dataset.i]; else m[el.dataset.i] = Number(el.value); a.answers[q.id] = m; markNav(a, q); saveAnswerSoon(a); },
};
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (!el || el.disabled) return; const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); } });
document.addEventListener("submit", e => { const f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault(); const fn = FORMS[f.dataset.form]; if (fn) fn(f); });
document.addEventListener("input", e => {
  const t = e.target, ds = t.dataset || {};
  if (ds.af) { S.authForm[ds.af] = t.type === "checkbox" ? t.checked : t.value; return; }
  const fn = INPUT[ds.in]; if (fn) fn(t);
});
document.addEventListener("change", e => {
  const t = e.target, ds = t.dataset || {};
  if (ds.af) { S.authForm[ds.af] = t.type === "checkbox" ? t.checked : t.value; if (S.authErr && S.authErr.field === ds.af && t.type === "checkbox" && t.checked) { S.authErr = null; const f = t.closest(".field"); if (f) { f.classList.remove("invalid"); const er = f.querySelector(".err"); if (er) er.remove(); } } return; }
  if (ds.pf && S.user) {
    const k = ds.pf; S.profile[k] = k === "duration" ? Number(t.value) : t.value;
    if (k === "name") { S.name = str(t.value); renderChrome(); }
    saveProfile(); toast("Cambios guardados.", "ok"); return;
  }
  const fn = CHANGE[ds.ch]; if (fn) fn(t);
});
document.addEventListener("keydown", e => {
  if (S.route !== "examen" || S.busy) return; const a = attemptById(S.params.id); if (!a || a.status !== "en_curso") return;
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement && document.activeElement.tagName)) return;
  if (e.key === "ArrowRight" && S.run.idx < a.qids.length - 1) { S.run.idx++; render(); }
  if (e.key === "ArrowLeft" && S.run.idx > 0) { S.run.idx--; render(); }
});
const flushNow = () => { if (S.route === "examen") { const a = attemptById(S.params.id); if (a && a.status === "en_curso") { clearTimeout(answerT); saveAttempt(a); } } Vault.flush(); };
document.addEventListener("visibilitychange", () => { if (document.hidden) flushNow(); });
window.addEventListener("pagehide", flushNow);

/* ============================================================
   Arranque
   ============================================================ */
(async function boot() {
  const timeout = ms => sleep(ms).then(() => ({ status: "unavailable" }));
  [S.chrome, S.local] = await Promise.all([Promise.race([chromeStatus(), timeout(4000)]), Promise.race([localStatus(), timeout(4000)])]);
  const acc = await Auth.resume();
  if (acc) { enterApp(acc); go("panel"); }
  else { S.authMode = Object.keys(Auth.list()).length ? "login" : "registro"; go("acceso"); }
})();
</script>
